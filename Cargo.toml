[workspace]
resolver = "3"
members = [
  "crates/*",
]

[workspace.package]
name = "terra"

# Own crates get light optimization (fast compile, usable speed); all
# dependencies (bevy, avian/parry physics, noise) compile fully optimized —
# they rarely change, and debug-mode physics against the 82k-tri terrain
# collider dominates frame time otherwise.
[profile.dev]
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
