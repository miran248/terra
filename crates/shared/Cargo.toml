[package]
name = "shared"
version = "0.1.0"
edition = "2024"

[features]
on-foot-prototype = []
car-prototype = []
plane-prototype = []

[dependencies]
bevy = "0.19.0"
noise = "0.9.0"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
fastrand = "2"
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }

[[bench]]
name = "facet_radius"
harness = false

[[bench]]
name = "terrain_gen"
harness = false
