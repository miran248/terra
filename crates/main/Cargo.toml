[package]
name = "main"
version = "0.1.0"
edition = "2024"

[features]
asset-review = []
on-foot-prototype = ["shared/on-foot-prototype"]
car-prototype = ["shared/car-prototype"]

[dependencies]
bevy = { version = "0.19.0", features = ["mouse", "touch", "debug"] }
shared = { path = "../shared" }
rand = "0.8"
avian3d = { version = "0.7", features = ["diagnostic_ui"] }
postcard = { version = "1", features = ["alloc"] }
